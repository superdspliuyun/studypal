name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject backend-only secrets leaking into frontend
        run: |
          set -e
          if grep -rE 'DEEPSEEK_API_KEY|DEEPSEEK_BASE_URL|JWT_SECRET|ACHIEVEMENT_DEFS|aggregate_calendar|compute_achievements' src/ ; then
            echo "::error::backend-only constant leaked into src/"
            exit 1
          fi
          if grep -rE 'DEEPSEEK_API_KEY|DEEPSEEK_BASE_URL|JWT_SECRET|ACHIEVEMENT_DEFS|aggregate_calendar|compute_achievements' dist/ ; then
            echo "::error::backend-only constant leaked into dist/"
            exit 1
          fi
          echo "frontend is clean of backend-only secrets"