<!-- SEO meta 同步维护：替换 [Your Name] / [Your Role] / [一句话自我介绍] / [username]
     时同步更新 src/data/profile.ts（design D1 + R1 Mitigation）。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO 基础（StudyPal 定位：spec「首页 SEO」+ proposal.md What Changes） -->
    <title>StudyPal — [Your Name] 的学习助手</title>
    <meta name="description" content="[Your Name] 的个人学习 Dashboard：每日目标清单、AI 学习建议、周/月学习趋势可视化（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta name="author" content="[Your Name]" />
    <link rel="canonical" href="https://[username].github.io/my-website/" />

    <!-- OpenGraph（StudyPal 定位） -->
    <meta property="og:title" content="StudyPal — [Your Name] 的学习助手" />
    <meta property="og:description" content="[Your Name] 的个人学习 Dashboard：每日目标清单、AI 学习建议、周/月学习趋势可视化（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://[username].github.io/my-website/" />
    <meta property="og:image" content="https://[username].github.io/my-website/og-image.svg" />
    <meta property="og:site_name" content="StudyPal — [Your Name]" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyPal — [Your Name] 的学习助手" />
    <meta name="twitter:description" content="[Your Name] 的个人学习 Dashboard：每日目标清单、AI 学习建议、周/月学习趋势可视化（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta name="twitter:image" content="https://[username].github.io/my-website/og-image.svg" />

    <script>
      // 必须在 React 渲染前同步执行，避免主题闪烁（spec「刷新后保留偏好」）。
      (function () {
          var s = null;
          try { s = localStorage.getItem('theme'); } catch (e) { s = null; }
          var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
