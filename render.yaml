services:
  - type: web
    name: studypal-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "https://*.github.io,http://localhost:5173"
      - key: ENV
        value: prod
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat